<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTask v1.1</title>
 
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
 
    body {
      background: linear-gradient(135deg, #eef8ff, #f7fbfd);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: #1f2937;
    }
 
    .app {
      width: 100%;
      max-width: 820px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.10);
      overflow: hidden;
    }
 
    .header {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      padding: 30px;
      text-align: center;
    }
 
    .version {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 12px;
      background: rgba(255,255,255,.18);
      border-radius: 20px;
    }
 
    .content {
      padding: 28px;
    }
 
    .input-group {
      display: grid;
      grid-template-columns: 1fr 160px 120px;
      gap: 10px;
      margin-bottom: 24px;
    }
 
    input, select {
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }
 
    #addTaskBtn {
      border: none;
      background: #0ea5e9;
      color: white;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
 
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
 
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
 
    .filter-btn {
      border: none;
      background: #e5e7eb;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
    }
 
    .filter-btn.active {
      background: #2563eb;
      color: white;
    }
 
    .clear-btn {
      border: none;
      background: #fff7ed;
      color: #ea580c;
      padding: 9px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
 
    .task-list {
      list-style: none;
    }
 
    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
 
    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
 
    .task-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
 
    .task.completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }
 
    .priority {
      width: fit-content;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
 
    .priority-baja {
      background: #dcfce7;
      color: #166534;
    }
 
    .priority-media {
      background: #fef3c7;
      color: #92400e;
    }
 
    .priority-alta {
      background: #fee2e2;
      color: #b91c1c;
    }
 
    .delete-btn {
      border: none;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
 
    .summary {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
 
    .summary-card {
      background: #eff6ff;
      color: #1e3a8a;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }
 
    .summary-card strong {
      display: block;
      font-size: 24px;
      margin-top: 5px;
    }
 
    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 25px;
    }
 
    footer {
      border-top: 1px solid #e5e7eb;
      text-align: center;
      padding: 18px;
      color: #6b7280;
      font-size: 13px;
    }
 
    @media(max-width:700px) {
      .input-group,
      .summary {
        grid-template-columns: 1fr;
      }
    }
  
/* Personalización visual de Ariel Valdiviezo y Diana Giler */
:root { color-scheme: dark; --panel:#121c34; --card:#1a2844; --stroke:#354560; --text:#f1f5ff; --muted:#b4c2da; --accent:#8b5cf6; --cyan:#22d3ee; }
* { font-family: 'Segoe UI', Inter, system-ui, sans-serif; }
body { background: radial-gradient(circle at 15% 12%, #233f6c 0, transparent 33%), radial-gradient(circle at 88% 85%, #392451 0, transparent 35%), #080f20; color:var(--text); padding:24px 14px; }
.app { max-width:960px; background:var(--panel); border:1px solid #384866; border-radius:24px; box-shadow:0 26px 80px #020617a8; }
.header { background:linear-gradient(115deg,#172f58,#41317e 60%,#12677a); padding:38px 28px; text-align:left; border-bottom:1px solid #6875c555; position:relative; }
.header::after { content:'✦'; font-size:54px; position:absolute; right:34px; top:25px; color:#91ecfc; opacity:.65; }
.header h1 { font-size:clamp(30px,5vw,44px); letter-spacing:-1.4px; margin:0 0 8px; }
.header p { font-size:15px; color:#e6e9ff; opacity:1; }
.version { display:inline-block; margin-top:16px; padding:7px 13px; border-radius:20px; background:#ffffff24; color:white; border:1px solid #ffffff4b; font-size:13px; font-weight:700; }
.content { padding:30px; }
.input-group { gap:12px; }
input:not([type='checkbox']), select { background:#101b31; border:1px solid var(--stroke); color:var(--text); border-radius:12px; min-width:0; }
input::placeholder { color:#9baac2; }
input:focus,select:focus { outline:2px solid #8b5cf6; outline-offset:1px; }
input[type='checkbox'] { accent-color:var(--accent); width:18px; height:18px; cursor:pointer; }
button { transition:filter .16s,transform .16s; }
button:hover { filter:brightness(1.14); transform:translateY(-1px); }
#addTaskBtn { background:linear-gradient(120deg,#7c3aed,#2563eb); color:white; border:0; border-radius:12px; min-height:46px; padding:12px 18px; box-shadow:0 8px 20px #6039da44; }
.filter-btn { background:#202e4a; color:#d7e4fa; border:1px solid #3f5070; border-radius:10px; }
.filter-btn.active { background:#6d44df; color:white; border:1px solid #a68cff; }
.task { background:var(--card); border:1px solid var(--stroke); border-radius:14px; gap:12px; color:var(--text); }
.task-left { min-width:0; }
.task-info, .task-text { overflow-wrap:anywhere; }
.task.completed .task-text { color:#8393aa; }
.delete-btn { background:#5a263e; color:#ffd3e0; border:1px solid #9a405d; border-radius:10px; }
.clear-btn { background:#55351f; color:#ffdbb1; border:1px solid #93613c; border-radius:10px; }
.summary { background:#1a2d47; color:#dcf4ff; border:1px solid #345575; border-radius:13px; }
.summary-card { background:#1a2d47; color:#dcf4ff; border:1px solid #345575; border-radius:13px; }
.summary-card strong { color:#90f0ff; }
.priority-baja { background:#1a5d48; color:#a7f3d0; }
.priority-media { background:#685028; color:#fde68a; }
.priority-alta { background:#71313d; color:#fecdd3; }
.empty { color:var(--muted); }
footer { background:#0f192e; color:#b8c7e0; border-top:1px solid #334762; padding:18px 24px; line-height:1.7; }
.credit { display:block; color:#f1f5ff; font-weight:650; font-size:14px; margin-bottom:5px; }
/* Controles propios de v1.2 */
.control-panel { gap:12px; }
.edit-btn { background:#253c66; color:#c4e5ff; border:1px solid #4568a0; border-radius:10px; }
.task.overdue { border-color:#d45a72; }
@media(max-width:700px){body {padding:12px;} .content {padding:19px;} .header {padding:28px 20px;} .header::after {right:16px;font-size:33px;} .input-group {grid-template-columns:1fr!important; flex-direction:column;} .control-panel {grid-template-columns:1fr!important;} .summary {grid-template-columns:1fr!important;} .task {flex-wrap:wrap;} .task-left {flex:1 1 100%;} }

  </style>
</head>
 
<body>
 
<div class="app">
 
  <div class="header">
    <h1>☁ CloudTask</h1>
    <p>Gestor de tareas interactivo</p>
    <span class="version">Versión 1.1</span>
  </div>
 
  <div class="content">
 
    <div class="input-group">
 
      <input
        id="taskInput"
        type="text"
        placeholder="Escribe una nueva tarea..."
      >
 
      <select id="prioritySelect">
        <option value="baja">Prioridad baja</option>
        <option value="media" selected>Prioridad media</option>
        <option value="alta">Prioridad alta</option>
      </select>
 
      <button id="addTaskBtn">Agregar</button>
 
    </div>
 
    <div class="toolbar">
 
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pending">Pendientes</button>
        <button class="filter-btn" data-filter="completed">Completadas</button>
      </div>
 
      <button id="clearCompletedBtn" class="clear-btn">
        Eliminar completadas
      </button>
 
    </div>
 
    <ul id="taskList" class="task-list"></ul>
 
    <div class="summary">
 
      <div class="summary-card">
        Total de tareas
        <strong id="totalCount">0</strong>
      </div>
 
      <div class="summary-card">
        Tareas pendientes
        <strong id="pendingCount">0</strong>
      </div>
 
    </div>
 
  </div>
 
  <footer>
    <span class="credit">Desarrollado por: Ariel Alejandro Valdiviezo González y Diana Lissette Giler Márquez</span>
    CloudTask v1.1 · GitHub + Vercel / Netlify
  </footer>
 
</div>
 
<script>
  const taskInput = document.getElementById("taskInput");
  const prioritySelect = document.getElementById("prioritySelect");
  const addTaskBtn = document.getElementById("addTaskBtn");
  const taskList = document.getElementById("taskList");
  const pendingCount = document.getElementById("pendingCount");
  const totalCount = document.getElementById("totalCount");
  const filterButtons = document.querySelectorAll(".filter-btn");
  const clearCompletedBtn =
    document.getElementById("clearCompletedBtn");
 
  let currentFilter = "all";
 
  let tasks =
    JSON.parse(localStorage.getItem("cloudTaskTasks"));
 
  if (!tasks) {
    tasks = [
      {
        id: 1,
        text: "Subir proyecto a GitHub",
        completed: false,
        priority: "alta"
      },
      {
        id: 2,
        text: "Desplegar aplicación en Vercel",
        completed: false,
        priority: "media"
      },
      {
        id: 3,
        text: "Probar aplicación desde el teléfono",
        completed: true,
        priority: "baja"
      }
    ];
  }
 
  function saveTasks() {
    localStorage.setItem(
      "cloudTaskTasks",
      JSON.stringify(tasks)
    );
  }
 
  function renderTasks() {
    taskList.innerHTML = "";
 
    const filteredTasks = tasks.filter(task => {
      if (currentFilter === "pending") return !task.completed;
      if (currentFilter === "completed") return task.completed;
      return true;
    });
 
    if (filteredTasks.length === 0) {
      taskList.innerHTML =
        '<li class="empty">No hay tareas para mostrar</li>';
    }
 
    filteredTasks.forEach(task => {
      const priorityText = {
        baja: "Baja",
        media: "Media",
        alta: "Alta"
      };
 
      const li = document.createElement("li");
      li.className = "task";
 
      if (task.completed) {
        li.classList.add("completed");
      }
 
      li.innerHTML = `
        <div class="task-left">
 
          <input
            type="checkbox"
            ${task.completed ? "checked" : ""}
            onchange="toggleTask(${task.id})"
          >
 
          <div class="task-info">
 
            <span class="task-text">
              ${task.text}
            </span>
 
            <span class="priority priority-${task.priority}">
              Prioridad ${priorityText[task.priority]}
            </span>
 
          </div>
 
        </div>
 
        <button
          class="delete-btn"
          onclick="deleteTask(${task.id})"
        >
          Eliminar
        </button>
      `;
 
      taskList.appendChild(li);
    });
 
    updateCounters();
    saveTasks();
  }
 
  function addTask() {
    const text = taskInput.value.trim();
 
    if (!text) {
      alert("Escribe una tarea.");
      return;
    }
 
    tasks.push({
      id: Date.now(),
      text,
      completed: false,
      priority: prioritySelect.value
    });
 
    taskInput.value = "";
    prioritySelect.value = "media";
 
    renderTasks();
  }
 
  function toggleTask(id) {
    tasks = tasks.map(task =>
      task.id === id
        ? { ...task, completed: !task.completed }
        : task
    );
 
    renderTasks();
  }
 
  function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    renderTasks();
  }
 
  function clearCompletedTasks() {
    if (!tasks.some(task => task.completed)) {
      alert("No hay tareas completadas.");
      return;
    }
 
    if (confirm("¿Eliminar todas las tareas completadas?")) {
      tasks = tasks.filter(task => !task.completed);
      renderTasks();
    }
  }
 
  function updateCounters() {
    totalCount.textContent = tasks.length;
 
    pendingCount.textContent =
      tasks.filter(task => !task.completed).length;
  }
 
  addTaskBtn.addEventListener("click", addTask);
 
  taskInput.addEventListener("keypress", event => {
    if (event.key === "Enter") addTask();
  });
 
  clearCompletedBtn.addEventListener(
    "click",
    clearCompletedTasks
  );
 
  filterButtons.forEach(button => {
    button.addEventListener("click", function() {
      filterButtons.forEach(btn =>
        btn.classList.remove("active")
      );
 
      this.classList.add("active");
      currentFilter = this.dataset.filter;
 
      renderTasks();
    });
  });
 
  renderTasks();
</script>
 
</body>
</html>
